name: Weekly reminder

# Reads PRODUCTION once a week and pushes one message to the owner's phone (ntfy) ONLY when this
# site needs something: the homepage not answering, the status switch unreadable from this origin
# (or without CORS for it), deploy drift, the updates strip's age, the pre-written runway. What is
# the same for every site — the switch's mode, quiet days, chag, the calendar's horizon — is
# printed here and pushed once, by the 3locksmiths reminder; an all-good week pushes nothing.
# scripts/live/check-reminders.mjs says what each means.
#
# It never builds, never deploys and never writes — the fleet's owner decision 5
# (3locksmiths.co.il docs/dynamic-presence-plan.md §4.5). This site's deploys are
# deploy.yml's alone: every push to main, plus the monthly rebuild. The one secret is the ntfy
# topic (NTFY_TOPIC; optional NTFY_SERVER). Without it the run prints the message and pushes
# nothing — and on GitHub it fails red, so a missing secret cannot go unnoticed.
#
# GitHub pauses scheduled workflows in a repository with no commits for 60 days; it emails the
# owner first. Any push re-arms it — or run it by hand from the Actions tab.

on:
  schedule:
    - cron: "0 5 * * 0" # Sunday 08:00 Israel summer time / 07:00 winter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read production and push the weekly message
        run: node scripts/live/check-reminders.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
