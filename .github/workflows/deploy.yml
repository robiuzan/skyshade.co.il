name: Build and deploy to Cloudflare Pages

# The live site (skyshade.co.il ≡ skyshade.pages.dev) is the Cloudflare Pages project
# "skyshade", created as a Direct Upload project. Direct Upload projects cannot be switched
# to Git integration, so this workflow IS the integration: build here, then push `out/`
# to the project with wrangler. Production = the `main` branch deployment.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — custom token with permission  Account › Cloudflare Pages › Edit
#   CLOUDFLARE_ACCOUNT_ID  — from Workers & Pages overview (right sidebar) or the dashboard URL
# Until both exist the build still runs (and the sitemap guard still gates it), but the
# deploy step is skipped with a notice instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monthly rebuild — keeps build-time values honest (footer year, computed
    # years-in-business) and lets seasonal copy rotate without a manual deploy.
    - cron: "0 4 1 * *"

permissions:
  contents: read

# One deploy at a time; let an in-progress one finish.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # `postbuild` runs scripts/check-sitemap.mjs and fails the build on sitemap drift.
      - name: Build static export
        run: npm run build

      - name: Deploy to Cloudflare Pages (project "skyshade", production branch main)
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=skyshade --branch=main --commit-dirty=true

      - name: Deploy skipped — Cloudflare secrets not configured
        if: env.HAS_CF_SECRETS != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so nothing was deployed."
          echo "::warning::Add both repository secrets, then re-run this workflow (Actions → Run workflow)."
